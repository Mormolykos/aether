[package]
name = "aether"
version = "0.1.0"
edition = "2021"
description = "Real-time aerospace telemetry ingestion, tracking and conjunction screening"

[lib]
name = "aether"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "aether"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Test-only. `net` and `io-util` exist so the polling-loop recovery test can stand up a
# throwaway listener that serves an oversized body. Dev-dependencies are not compiled
# into the release binary, so the shipped artefact gains no inbound networking.
[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util", "macros", "rt-multi-thread"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
